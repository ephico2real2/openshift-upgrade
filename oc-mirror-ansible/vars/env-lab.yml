# The Hetzner lab (scripts/host-prep/INSTALL.md). No secrets: see vars/env.yml.example.
# Use with: ansible-playbook playbook.yml --ask-vault-pass -e @vars/env-lab.yml ...

# base_path is not set: the lab uses the default /data/oc-mirror, as at work. /registry-data holds
# only the data of Quay (mirror-registry), so oc-mirror files stay out of it.
oc_mirror_bin: "/usr/local/bin/oc-mirror"                       # install-cli-tools.sh installs it here
target_registry_fqdn: "kcs-ewd-registry.getsolisvault.com:8443"
mirror_namespace: "ocp4v2"                                      # change to the organization name used at work
