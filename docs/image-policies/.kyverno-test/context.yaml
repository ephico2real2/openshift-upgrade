apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: context
spec:
  resources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: allowed-image-registries
      namespace: kyverno
    data:
      registries: |
        registry.redhat.io
        registry.access.redhat.com
        registry.connect.redhat.com
        image-registry.openshift-image-registry.svc:5000
        registry-dc1.example.com:8443
